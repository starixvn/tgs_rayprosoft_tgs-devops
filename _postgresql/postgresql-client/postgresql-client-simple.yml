---
apiVersion: v1
kind: Pod
metadata:
  name: pg-client
  namespace: dev
  labels:
    app: postgresql-client
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "true"    
spec:
  securityContext:
    runAsNonRoot: true
    supplementalGroups: [ 10001] 
    fsGroup: 10001    
  containers:
    - env:
      - name: PG_HOSTNAME
        value: "pgpool"
      - name: PG_PORT
        value: 9999
      - name: PG_USERNAME
        value: "rpdev"
      - name: PG_PASSWORD
        value: "abcd1234"
    - name: postgresql-client
      image: andreswebs/postgresql-client
      imagePullPolicy: Always
      securityContext:
        runAsUser: 1000      
      stdin: true
      tty: true
      command: ["/bin/sh"]