apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: baget-pv-claim
  labels:
    app: baget
spec:
  storageClassName: gp2
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---

apiVersion: v1
kind: Secret
metadata:
  name: baget-apikey-secret
type: Opaque
data:
  apikey: YWRtaW4=

---

apiVersion: v1
kind: Service
metadata:
  name: baget
  labels:
    app: baget
spec:
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
  selector:
    app: baget
  type: ClusterIP
  
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: baget
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: baget.rpgp.cc
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: baget
            port: 
              number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baget
  labels:
    app: baget
spec:
  replicas: 1
  selector:
    matchLabels:
      app: baget
  template:
    metadata:
      labels:
        app: baget
    spec:
      containers:
      - name: baget
        image: loicsharma/baget
        ports:
        - containerPort: 80
        env:
        - name: ApiKey
          valueFrom:
            secretKeyRef:
              name: baget-apikey-secret
              key: apikey
        - name: Database__Type
          value: PostgreSql
        - name: Database__ConnectionString
          value: Server=db-production.cglu874fh5rb.ap-east-1.rds.amazonaws.com;Port=5432;User Id=baget;Password=baget123;Database=baget
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 3 
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        volumeMounts:
        - name: baget-persistent-storage
          mountPath: /app/packages
      volumes:
      - name: baget-persistent-storage
        persistentVolumeClaim:
          claimName: baget-pv-claim