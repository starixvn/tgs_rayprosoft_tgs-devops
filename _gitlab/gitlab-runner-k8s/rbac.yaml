apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tgs-build-gitlab-runner
  namespace: dev
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - services
  - ingresses
  - serviceaccounts
  - secrets
  - pods
  - pods/exec
  - pods/attach
  verbs:
  - create
  - update
  - delete
  - get
  - patch
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tgs-build-gitlab-runner
  namespace: dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tgs-build-gitlab-runner
subjects:
- kind: ServiceAccount
  name: backend-gitlab-runner
  namespace: gitlab-runner