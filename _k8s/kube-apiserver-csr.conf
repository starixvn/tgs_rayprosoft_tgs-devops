# openssl req -new -key kube-apiserver.key -out kube-apiserver.csr -config kube-apiserver-csr.conf
# openssl x509 -req -in kube-apiserver.csr -CA /etc/kubernetes/pki/ca.crt -CAkey /etc/kubernetes/pki/ca.key -CAcreateserial -out kube-apiserver.crt -days 365 -extensions v3_req -extfile kube-apiserver-csr.conf
[ req ]
default_bits = 2048
prompt = no
default_md = sha256
distinguished_name = dn
req_extensions = v3_req

[ dn ]
CN = kubernetes

[ v3_req ]
basicConstraints = CA:FALSE
keyUsage = nonRepudiation, digitalSignature, keyEncipherment
extendedKeyUsage = serverAuth
subjectAltName = @alt_names

[ alt_names ]
DNS.1 = kubernetes
DNS.2 = kubernetes.default
DNS.3 = kubernetes.default.svc
DNS.4 = kubernetes.default.svc.cluster.local
DNS.5 = master2
DNS.6 = master3
DNS.7 = kube-api.rpgp.cc
IP.1 = 192.168.112.11
IP.2 = 192.168.112.12
IP.3 = 192.168.112.13
IP.4 = 125.227.69.111
IP.5 = 192.168.112.50
IP.6 = 10.96.0.1