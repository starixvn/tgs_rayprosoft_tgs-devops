apiVersion: k6.io/v1alpha1
kind: K6
metadata:
  name: lobby-stress-test
  namespace: k6
spec:
  parallelism: 4
  script:
    configMap:
      name: lobby-stress-test
      file: stress-test
  runner:
    metadata:
    image: ghcr.io/grafana/k6-operator:latest-runner
    env:
      - name: K6_PROMETHEUS_RW_SERVER_URL
        value: http://prometheus-stack-kube-prom-prometheus.monitoring:9090/api/v1/write
      - name: K6_OUT
        value: experimental-prometheus-rw