---
# Run grafana-backup-tool daily and store backups in an S3
# compatible object storage such as minio
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-stack-backup
  namespace: monitoring
  labels:
    app: grafana-stack-backup
spec:
  schedule: "33 8 * * *"
  jobTemplate:
    metadata:
      labels:
        app: grafana-stack-backup
    spec:
      template:
        spec:
          restartPolicy: "Never"
          containers:
            - name: grafana-stack-backup
              image: "ysde/docker-grafana-backup-tool:1.2.4"
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: grafana-stack-backup