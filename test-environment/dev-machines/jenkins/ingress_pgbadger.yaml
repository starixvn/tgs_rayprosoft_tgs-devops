apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgbadger
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: pgbadger.srvptt.com
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: pgbadger-assets
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: pgbadger-assets
spec:
  ports:
  - name: app
    port: 80
    protocol: TCP
    targetPort: 80
  clusterIP: None
  type: ClusterIP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: pgbadger-assets
subsets:
- addresses:
  - ip: 192.168.50.109
  ports:
  - name: app
    port: 80
    protocol: TCP
