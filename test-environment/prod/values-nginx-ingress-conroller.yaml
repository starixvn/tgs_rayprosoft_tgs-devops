controller:
  config:
    hsts: false
    otlp-collector-host: otel-svc.observability
    enable-opentelemetry: "true"
    opentelemetry-operation-name: "HTTP $request_method $uri"
    otel-service-name: nginx-ingress-controller
  opentelemetry:
    enabled: true
  service:
    type: LoadBalancer
  metrics:
    enabled: "true"
    service:
      annotations:
        prometheus.io/port: "10254"
        prometheus.io/scrape: "true"
  ingressClassResource:
    name: nginx
    controllerValue: "k8s.io/ingress-nginx"
  ingressClass: nginx
  resources:
    requests:
      cpu: 2
      memory: 4Gi
    limits:
      cpu: 2
      memory: 4Gi
