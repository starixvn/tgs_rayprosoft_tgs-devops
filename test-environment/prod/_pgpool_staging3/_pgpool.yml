apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgpool3
  namespace: prod
spec:
  replicas: 8
  selector:
    matchLabels:
      app: pgpool3
  template:
    metadata:
      labels:
        app: pgpool3
    spec:
      nodeSelector:
        dedicated: prod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      containers:
      - name: pgpool
        image: pgpool/pgpool:4.2.2
        livenessProbe:
          tcpSocket:
            port: 9999
          initialDelaySeconds: 30
          periodSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 9999
          initialDelaySeconds: 30
          periodSeconds: 5
        resources:
          limits:
            cpu: 900m
            memory: 900Mi
          requests:
            cpu: 500m
            memory: 600Mi
        env:
        - name: POSTGRES_USERNAME
          valueFrom:
            secretKeyRef:
              name: secret-pgpool3
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-pgpool3
              key: password
        volumeMounts:
        - name: volume-config
          mountPath: /config
      - name: pgpool-stats
        image: pgpool/pgpool2_exporter
        livenessProbe:
          tcpSocket:
            port: 9719
          initialDelaySeconds: 30
          periodSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 9719
          initialDelaySeconds: 30
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        env:
        - name: POSTGRES_USERNAME
          valueFrom:
            secretKeyRef:
              name: secret-pgpool3
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-pgpool3
              key: password
        - name: POSTGRES_DATABASE
          value: "postgres"
        - name: PGPOOL_SERVICE
          value: "localhost"
        - name: PGPOOL_SERVICE_PORT
          value: "9999"
      volumes:
      - name: volume-config
        configMap:
          name: configmap-pgpool3
---
apiVersion: v1
kind: Service
metadata:
  name: pgpool3
  namespace: prod
spec:
  selector:
    app: pgpool3
  ports:
  - name: pgpool-port
    protocol: TCP
    port: 9999
    targetPort: 9999
---
apiVersion: v1
kind: Service
metadata:
  name: pgpool-stats3
  namespace: prod
  labels:
    app: pgpool-stats3
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "9719"
    prometheus.io/scrape: "true"
spec:
  selector:
    app: pgpool
  ports:
  - name: pgpool-stats-port
    protocol: TCP
    port: 9719
    targetPort: 9719