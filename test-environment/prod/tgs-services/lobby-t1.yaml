apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: lobby-gpi-t1
    type: frontend
  name: lobby-gpi-t1
  namespace: prod
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: lobby-gpi-t1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2023-03-24T09:41:15Z"
      creationTimestamp: null
      labels:
        app: lobby-gpi-t1
        type: frontend
    spec:
      containers:
      - env:
        - name: CLIENT
          value: I7nKiimrZQOqnJ6ryjUw74c0Hi64KC6Myunhob4cHh8VOUIuZh4p63czefxyyzbZ
        - name: CURRENCY
          value: CNY
        - name: BRAND
          value: PGG
        - name: DEFAULT_LANGUAGE
          value: zh-CN
        - name: THEME
          value: red
        - name: SOURCE_URL
          value: https://images.srvptt.com/
        - name: DEPLOY_DATE
          value: 2022-02-25-18:45
        image: pgtgs/lobby-t1:prod-2023-0627-0946
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthcheck
            port: 80
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        name: lobby-gpi-t1
        ports:
        - containerPort: 80
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthcheck
            port: 80
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 30m
            memory: 50Mi
          requests:
            cpu: 5m
            memory: 30Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: site-data
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: registry-credentials
      - name: dockerhub
      nodeSelector:
        dedicated: prod
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      volumes:
      - emptyDir: {}
        name: site-data
---
apiVersion: v1
kind: Service
metadata:
  name: lobby-gpi-t1
  namespace: prod
spec:
  ports:
  - name: web
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: lobby-gpi-t1
  type: ClusterIP
---
