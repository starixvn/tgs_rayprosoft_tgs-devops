apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: brand-cert-api
    tgs.kind: brand
  name: brand-cert-api
  namespace: prod
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: brand-cert-api
      tgs.kind: brand
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2022-12-05T22:04:19+08:00"
        prometheus.io/path: /metrics
        prometheus.io/port: "52325"
        prometheus.io/scrape: "true"
      creationTimestamp: null
      labels:
        app.kubernetes.io/name: brand-cert-api
        tgs.kind: brand
    spec:
      containers:
      - env:
        - name: OTEL_SERVICE_NAME
          value: Brand-Cert-Api(prod)
        - name: NODE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: ConnectionStrings__Tgs
          valueFrom:
            secretKeyRef:
              key: tgs
              name: tgs-connections
        - name: ConnectionStrings__Nats
          valueFrom:
            secretKeyRef:
              key: nats
              name: tgs-connections
        - name: Brand__SecurityKeyPath
          value: /config/certs/key.pem
        - name: DOTNET_DiagnosticPorts
          value: /diag/port
        - name: STAKATER_TGS_CONNECTIONS_SECRET
          value: 8955c5c0b8702e1b07a8a4f12f32fe848669049f
        - name: STAKATER_BRAND_CERT_SECRET
          value: 823692ba22d1823eecc3fee8604aa70330513bc2
        image: pgtgs/brand-cert-api:202306270504.59
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: brand-cert-api
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 400Mi
          requests:
            cpu: 100m
            memory: 400Mi
        securityContext: {}
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /config/appsettings.json
          name: appsettings
          readOnly: true
          subPath: appsettings.json
        - mountPath: /config/certs/key.pem
          name: cert
          readOnly: true
          subPath: key.pem
        - mountPath: /diag
          name: diagvol
        - mountPath: /dumps
          name: dumpsvol
      - args:
        - --no-auth
        env:
        - name: DOTNETMONITOR_DiagnosticPort__ConnectionMode
          value: Listen
        - name: DOTNETMONITOR_DiagnosticPort__EndpointName
          value: /diag/port
        - name: DOTNETMONITOR_Storage__DumpTempFolder
          value: /dumps
        - name: DOTNETMONITOR_Urls
          value: http://+:52324
        - name: DOTNETMONITOR_Metrics__Endpoints
          value: http://+:52325
        - name: XDG_CONFIG_HOME
          value: /config
        image: mcr.microsoft.com/dotnet/monitor:6.0.0
        imagePullPolicy: IfNotPresent
        name: monitor
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 32Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /diag
          name: diagvol
        - mountPath: /dumps
          name: dumpsvol
        - mountPath: /config/dotnet-monitor/settings.json
          name: appsettings
          readOnly: true
          subPath: monitor.settings.json
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: dockerhub
      nodeSelector:
        dedicated: prod
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      volumes:
      - configMap:
          defaultMode: 420
          name: configmap-brand-cert-api
        name: appsettings
      - name: cert
        secret:
          defaultMode: 420
          secretName: brand-cert
      - emptyDir: {}
        name: diagvol
      - emptyDir: {}
        name: dumpsvol
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: brand-cert-api
    tgs.kind: brand
  name: brand-cert-api
  namespace: prod
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: brand-cert-api
    tgs.kind: brand
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-brand-cert-api
  namespace: prod
data:
  appsettings.json: |
    {
    }
  monitor.settings.json: |
    {
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: brand-cert
  namespace: prod
type: Opaque
data:
  key.pem: 