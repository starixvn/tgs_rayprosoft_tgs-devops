apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  name: bo
  namespace: prod
spec:
  rules:
  - host: bo-test.srvptt.com
    http:
      paths:
      - backend:
          service:
            name: backoffice-api
            port:
              number: 80
        path: /api
        pathType: ImplementationSpecific
      - backend:
          service:
            name: file-service
            port:
              number: 80
        path: /fs
        pathType: ImplementationSpecific
      - backend:
          service:
            name: backoffice-site
            port:
              number: 80
        path: /
        pathType: ImplementationSpecific