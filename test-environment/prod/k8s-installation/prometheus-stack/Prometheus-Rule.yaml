apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
 labels:
   app: kube-prometheus-stack
   release: prometheus-stack
 name: prometheus-altertrule-1
 namespace: monitoring
spec:
 groups:
 - name: alertrule-1
   rules:
   - alert: abnormal_http_requests_total
     expr: sum(rate(http_requests_total{}[5m])) by (pod) > 0.001
     for: 1m
     labels:
       severity: critical
       namespace: default
     annotations:
       env: "dev"
       message: "critical: Linux Server down"
       summary: "http_requests_total > 0.001"
