kind: Deployment

extraPorts:
  - containerPort: 24224
    protocol: TCP
    name: forward
    port: 24224

env:
  - name: FLUENT_ELASTICSEARCH_HOST
    value: "elasticsearch-es-default.eck"
  - name: FLUENT_ELASTICSEARCH_PORT
    value: "9200"

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush {{ .Values.flush }}
        Log_Level {{ .Values.logLevel }}
        Parsers_File parsers.conf
        Parsers_File custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port {{ .Values.metricsPort }}
        Health_Check On

  ## https://docs.fluentbit.io/manual/pipeline/inputs
  inputs: |
    [INPUT]
        Name              forward

  ## https://docs.fluentbit.io/manual/pipeline/filters
  filters: |
    [FILTER]
        Name    lua
        Match   log.*
        script  /fluent-bit/scripts/append_tag.lua
        call    append_tag

  ## https://docs.fluentbit.io/manual/pipeline/outputs
  outputs: |
    [OUTPUT]
        Name            es
        Match           kube.*
        Host            ${FLUENT_ELASTICSEARCH_HOST}
        Port            ${FLUENT_ELASTICSEARCH_PORT}
        Logstash_Format On
        Logstash_Prefix kube
        Replace_Dots    On
        Trace_Error     On
        Buffer_Size     5M
        Suppress_Type_Name On

    [OUTPUT]
        Name es
        Match host.*
        Host ${FLUENT_ELASTICSEARCH_HOST}
        Port ${FLUENT_ELASTICSEARCH_PORT}
        Logstash_Format On
        Logstash_Prefix node
        Buffer_Size     5M
        Suppress_Type_Name On
    
    [OUTPUT]
        Name            es
        Match           log.*
        Host            ${FLUENT_ELASTICSEARCH_HOST}
        Port            ${FLUENT_ELASTICSEARCH_PORT}
        Logstash_Format On
        Logstash_Prefix log_unknown
        Logstash_Prefix_Key es_index
        Include_Tag_Key On
        Suppress_Type_Name On
        Trace_Error     On
        Buffer_Size     5M

luaScripts:
  append_tag.lua: |
    function append_tag(tag, timestamp, record)
        new_record = record
        new_record["es_index"] = "log-"..tag:gsub("log.", ""):lower()
        return 1, timestamp, new_record
    end

logLevel: warn

tolerations:
  - effect: NoSchedule
    key: dedicated
    operator: Exists
