## https://docs.fluentbit.io/manual/administration/configuring-fluent-bit/configuration-file
extraPorts:
  - containerPort: 24224
    protocol: TCP
    name: forward
    port: 24224

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush {{ .Values.flush }}
        Log_Level {{ .Values.logLevel }}
        Parsers_File parsers.conf
        Parsers_File custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port {{ .Values.metricsPort }}
        Health_Check On

  ## https://docs.fluentbit.io/manual/pipeline/inputs
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On

    [INPUT]
        Name systemd
        Tag host.*
        Systemd_Filter _SYSTEMD_UNIT=kubelet.service
        Read_From_Tail On

    [INPUT]
        Name              forward
        Tag_Prefix        log.

  ## https://docs.fluentbit.io/manual/pipeline/filters
  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On
    [FILTER]
        Name lua
        Match log.*
        script /fluent-bit/scripts/modify_adminlog.lua
        call extract_adminlog

  ## https://docs.fluentbit.io/manual/pipeline/outputs
  outputs: |
    [OUTPUT]
        Name          forward
        Match         *
        Host          log-center-fluent-bit
        Port          24224

luaScripts:
  modify_adminlog.lua: |
    function extract_adminlog(tag, timestamp, record)
        if (record.EventId.Name ~= "AdminLog") then
          return 1, timestamp, record
        end
        
        new_record = record
        sourceKey = string.char(123).."source"..string.char(125)
        
        new_record["AdminLog"] = record["StateValues"][1][sourceKey]
        new_record["StateValues"][1][sourceKey] = nil
        new_record["AdminLog"]["trackingid"] = nil

        return 1, timestamp, new_record
    end

logLevel: warn

tolerations:
  - effect: NoSchedule
    key: dedicated
    operator: Exists
