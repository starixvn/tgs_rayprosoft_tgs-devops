apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  namespace: observability
  labels:
    otel: collector
  annotations:
    configmap.reloader.stakater.com/reload: "configmap-otel-collector"
spec:
  selector:
    matchLabels:
      name: otel-collector
  template:
    metadata:
      labels:
        name: otel-collector
    spec:
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Exists
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector:0.41.0
          resources:
            limits:
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 50Mi
          ports:
            - containerPort: 13133
              hostPort: 13133
              protocol: TCP
            - containerPort: 4317
              hostPort: 4317
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/otel/config.yaml
              name: config
              readOnly: true
              subPath: otel-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 13133
            initialDelaySeconds: 1
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 3
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: configmap-otel-collector