# https://www.jianshu.com/p/0e4981381507
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: service-monitor-ingress
  namespace: monitoring
  labels:
    app: service-monitor-ingress
    release: prometheus-stack
spec:
  namespaceSelector:
    matchNames:
    - ingress-nginx
  selector:
    matchLabels:
      app.kubernetes.io/instance: ingress-nginx
  endpoints:
  - port: metrics
    schema: http