kind: ServiceMonitor
apiVersion: monitoring.coreos.com/v1
metadata:
 name: service-monitor-ingress
 namespace: monitoring
 labels:
   app: service-monitor-ingress
   release: prometheus-stack
spec:
  namespaceSelector:
    matchNames:
    - ingress-nginx
  selector:
    matchLabels:
      app.kubernetes.io/instance: ingress-nginx
  endpoints:
  - port: metrics