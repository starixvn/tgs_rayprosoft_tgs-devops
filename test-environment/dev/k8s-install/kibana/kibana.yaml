apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: valhalla-kibana
  namespace: observability
spec:
  version: 8.7.0 # elasticsearch version
  count: 1
  config:
    elasticsearch.hosts:
      - http://elasticsearch.master:9200 #pod ip
    csp.strict: false
    csp.warnLegacyBrowsers: false
  http:
    service:
      spec:
        type: ClusterIP
    tls:
      selfSignedCertificate:
        disabled: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana
  namespace: observability
spec:
  ingressClassName: nginx
  rules:
  - host: kibana.rpgp.cc
    http:
      paths:
      - backend:
          service:
            name: kibana-kb-http
            port:
              number: 5601
        path: /
        pathType: Prefix