apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
  name: operator-api
  namespace: dev
spec:
  minReplicas: 2
  maxReplicas: 10
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: operator-api
  metrics:
  - type: Pods
    pods:
      metric:
        name: microsoftaspnetcorehosting_requests_per_second
      target:
        averageValue: 3m
        type: AverageValue
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
        
## kubectl get --raw "/apis/custom.metrics.k8s.io/v1beta1/namespaces/dev/pods/*/microsoftaspnetcorehosting_requests_per_second"