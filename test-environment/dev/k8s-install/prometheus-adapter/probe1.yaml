apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: example2
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  interval: 60s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
      - https://google.com
