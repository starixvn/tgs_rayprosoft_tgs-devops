apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: operator-api
  namespace: monitoring
  labels:
    release: prometheus
spec:
  interval: 60s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
      - http://operator-api.staging
