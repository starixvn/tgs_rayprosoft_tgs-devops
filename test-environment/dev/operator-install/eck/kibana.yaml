apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: observability
spec:
  config:
    csp.strict: false
    elasticsearch.hosts:
    - http://elasticsearch-master:9200
  count: 1
  http:
    service:
      spec:
        type: ClusterIP
    tls:
      selfSignedCertificate:
        disabled: true
  version: 8.5.1