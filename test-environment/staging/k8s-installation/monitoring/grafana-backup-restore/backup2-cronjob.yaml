---
# Run grafana-backup-tool daily and store backups in an S3
# compatible object storage such as minio
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana2-backup-tool
  namespace: monitoring
  labels:
    app: grafana2-backup-tool
spec:
  schedule: "2 7 * * *"
  jobTemplate:
    metadata:
      labels:
        app: grafana2-backup-tool
    spec:
      template:
        spec:
          restartPolicy: "Never"
          containers:
            - name: grafana2-backup-tool
              image: "ysde/docker-grafana-backup-tool:1.2.4"
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: grafana2-backup-tool