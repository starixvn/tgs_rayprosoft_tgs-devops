# https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
defaultRules:
  create: true
  rules:
    kubelet: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
    - source_matchers:
      - 'severity = critical'
      target_matchers:
      - 'severity =~ warning|info'
      equal:
      - 'namespace'
      - 'alertname'
    - source_matchers:
      - 'severity = warning'
      target_matchers:
      - 'severity = info'
      equal:
      - 'namespace'
      - 'alertname'
    - source_matchers:
      - 'alertname = InfoInhibitor'
      target_matchers:
      - 'severity = info'
      equal:
       - 'namespace'
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'staging-telegram'
      routes:
      - receiver: 'staging-telegram'
        matchers:
        - alertname =~ "InfoInhibitor|Watchdog"
    receivers:
    - name: 'staging-telegram'
      telegram_configs:
      - bot_token: 6137223098:AAEeQiBaQ1G1Gj5pO7p9q_FVwvXViM1BMcg
        api_url: https://api.telegram.org
        chat_id: -1001928893410
        parse_mode: ''
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - stg-alertmanager.rpgp.cc
  alertmanagerSpec:
    nodeSelector:
      dedicated: staging
    tolerations:
    - effect: NoSchedule
      key: dedicated
      operator: Equal
      value: staging  
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
grafana: 
  nodeSelector:
    dedicated: staging
  tolerations:
  - effect: NoSchedule
    key: dedicated
    operator: Equal
    value: staging  
  ingress: 
    enabled: true
    ingressClassName: nginx
    hosts:
    - stg-grafana.rpgp.cc
prometheus:
  ingress: 
    enabled: true
    ingressClassName: nginx
    hosts:
    - stg-prometheus.rpgp.cc
  prometheusSpec:
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    nodeSelector:
      dedicated: staging
    tolerations:
    - effect: NoSchedule
      key: dedicated
      operator: Equal
      value: staging  
    resources:
      limits:
        cpu: 2000m
        memory: 3000Mi
      requests:
        cpu: 500m
        memory: 1000Mi
    storageSpec: 
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 100Gi