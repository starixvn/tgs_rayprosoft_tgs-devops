apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
 name: config-telegram
 labels:
   alertmanagerConfig: example
 namespace: monitoring
spec:
 route:
   groupBy: ['namespace']
   groupInterval: 1m
   groupWait: 30s
   repeatInterval: 30s
   receiver: 'staging-telegram'
   routes:
   - continue: true
     matchers:
     - name: severity
       value: critical
     receiver: staging-telegram
  receivers:
  - name: 'staging-telegram'
    telegram_configs:
    - bot_token: 6137223098:AAEeQiBaQ1G1Gj5pO7p9q_FVwvXViM1BMcg
      api_url: https://api.telegram.org
      chat_id: -1001928893410
      parse_mode: ''