apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: $agent
    type: frontend
  name:  $agent
  namespace: dev
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: $agent
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: $agent
        type: frontend
    spec:
      containers:
      - env:
        - name: CLIENT
          value: VxSVy4C2tGgoNBq3JVzlJSghtkU3ydxAbdjxUBvZfJUJkgXRb8MM32
        - name: CURRENCY
          value: CNY
        - name: BRAND
          value: PGG
        - name: SITE
          value: $site
        - name: DEFAULT_LANGUAGE
          value: $lang
        - name: THEME
          value: red
        - name: SOURCE_URL
          value: https://images.srvptt.com/
        image: $image
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthcheck
            port: 80
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 30m
            memory: 50Mi
          requests:
            cpu: 5m
            memory: 30Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: site-data
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: registry-credentials
      - name: dockerhub
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: site-data
---
apiVersion: v1
kind: Service
metadata:
  name: $agent
  namespace: dev
spec:
  ports:
  - name: web
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: $agent
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Brand-Token $token;
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  name: $agent
  namespace: dev
spec:
  ingressClassName: nginx
  rules:
  - host: $domain
    http:
      paths:
      - backend:
          service:
            name: $agent
            port:
              number: 80
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: agent-pito7
            port:
              number: 80
        path: /
        pathType: Prefix