version: '3.7'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.10.0
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jaeger-network

  kibana:
    image: docker.elastic.co/kibana/kibana:7.10.0
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - jaeger-network

  jaeger-collector:
    image: jaegertracing/jaeger-collector:latest
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
      - SPAN_STORAGE_TYPE=elasticsearch
      - ES_SERVER_URLS=http://elasticsearch:9200
    ports:
      - "14268:14268"         # Jaeger tracing
      - "14250:14250"         # Jaeger gRPC port
      - "4317:4317"
      - "4318:4318"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - jaeger-network
      
  jaeger-query:
    image: jaegertracing/jaeger-query:latest
    environment:
      - SPAN_STORAGE_TYPE=elasticsearch
      - ES_SERVER_URLS=http://elasticsearch:9200
    ports:
      - "16686:16686"         # Jaeger UI port
    depends_on:
      - jaeger-collector
    networks:
      - jaeger-network

  nats-server:
    image: nats:latest
    ports:
      - "4222:4222"  # NATS 服务器端口
      - "8222:8222"  # NATS 监控界面端口
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf  # 挂载配置文件
      - nats-jetstream-data:/jetstream/store  # 挂载 JetStream 数据目录
    command: ["-c", "/etc/nats/nats-server.conf"]  # 使用自定义配置文件
    restart: always

  nats-exporter:
    image: natsio/prometheus-nats-exporter:latest
    hostname: nats-exporter
    command: "-connz -varz -channelz -serverz -subz http://localhost:8222"
    ports:
      - "9110:9110"  # 导出器端口
    environment:
      - NATS_SERVERS=nats://nats-server:4222  # 指定 NATS 服务器的地址和端口
    depends_on:
      - nats-server
    restart: always
  
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9090"]
      interval: 10s
      timeout: 30s
      retries: 10
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - jaeger-network
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=abcd1234
    volumes:
      - grafana-data:/var/lib/grafana:rw
    user: "472:472"
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - jaeger-network

volumes:
  nats-jetstream-data:
  grafana-data:
    driver: local
networks:
  jaeger-network:
    driver: bridge
                      